buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.exaroton:api:2.4.1'
    }
}

def exarotonProps() {
    def propsFile = rootProject.file('exaroton.properties')
    if (!propsFile.exists()) {
        return null
    }
    def props = new Properties()
    propsFile.withInputStream { props.load(it) }
    return props
}

def exarotonServerId() {
    def props = exarotonProps()
    if (props != null && props.getProperty('serverId') != null) {
        return props.getProperty('serverId')
    }
    return providers.gradleProperty('exarotonServerId').getOrElse('gg2r65YbfyeS5GkU')
}

def obtainExarotonToken() {
    // Order: env var > gradle property (-PexarotonToken=...) > exaroton.properties (gitignored)
    def token = providers.environmentVariable('EXAROTON_TOKEN').getOrNull()
    if (token == null || token.isEmpty()) {
        token = providers.gradleProperty('exarotonToken').getOrNull()
    }
    if (token == null || token.isEmpty()) {
        def props = exarotonProps()
        if (props != null) {
            token = props.getProperty('apiToken')
        }
    }
    if (token == null || token.isEmpty()) {
        throw new GradleException(
                'Exaroton API token not found. Set EXAROTON_TOKEN, pass -PexarotonToken=..., or create exaroton.properties (gitignored) with apiToken=...'
        )
    }
    return token
}

def exarotonClient() {
    return new com.exaroton.api.ExarotonClient(obtainExarotonToken())
}

def exarotonModsDir() {
    return providers.gradleProperty('exarotonModsDir').getOrElse('/mods')
}

// Resolves the fabric-api jar so it can be deployed alongside the mod.
configurations {
    exarotonJars
    exarotonRunner
}
dependencies {
    exarotonJars "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    exarotonRunner localGroovy()
}

// Generated under build/ when needed so the task has no separate source-file dependency.
def exarotonTestServerSource = '''
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

import java.net.http.HttpClient
import java.net.http.HttpRequest
import java.net.http.HttpResponse
import java.time.Duration
import java.util.concurrent.atomic.AtomicBoolean

// REST endpoints: https://developers.exaroton.com/
// The pinned Java API client does not support server creation/deletion yet.
class ExarotonTestServer {
    final URI baseUri
    final String token
    final HttpClient http = HttpClient.newBuilder().connectTimeout(Duration.ofSeconds(20)).build()
    final AtomicBoolean stopping = new AtomicBoolean()
    final Object lifecycleLock = new Object()
    String serverId

    ExarotonTestServer(String token, URI baseUri = URI.create('https://api.exaroton.com/v1/')) {
        this.token = token
        this.baseUri = baseUri
    }

    def request(String method, String path, Object body = null, String contentType = 'application/json') {
        def publisher = body instanceof File ? HttpRequest.BodyPublishers.ofFile(body.toPath()) :
                body == null ? HttpRequest.BodyPublishers.noBody() :
                        HttpRequest.BodyPublishers.ofString(JsonOutput.toJson(body))
        def req = HttpRequest.newBuilder(baseUri.resolve(path))
                .timeout(Duration.ofSeconds(60))
                .header('Authorization', 'Bearer ' + token)
                .header('Content-Type', contentType)
                .method(method, publisher).build()
        def response = http.send(req, HttpResponse.BodyHandlers.ofString())
        def result
        try {
            result = new JsonSlurper().parseText(response.body())
        } catch (groovy.json.JsonException | IllegalArgumentException ignored) {
            // Proxies can return a non-JSON error response.
        }
        if (response.statusCode() < 200 || response.statusCode() >= 300) {
            def detail = result instanceof Map && result.error ? ": ${result.error}" : ''
            throw new IOException("Exaroton ${method} ${path}: HTTP ${response.statusCode()}${detail}")
        }
        if (!(result instanceof Map) || !result.success) {
            throw new IOException("Exaroton ${method} ${path}: ${result instanceof Map ? result.error : 'Invalid API response'}")
        }
        result.data
    }

    // Serialize setup with cleanup, including recording the ID returned by creation.
    def duringSession(Closure action) {
        synchronized (lifecycleLock) {
            if (stopping.get()) {
                throw new InterruptedException('Test session stopped')
            }
            action.call()
        }
    }

    void cleanup() {
        stopping.set(true)
        synchronized (lifecycleLock) {
            if (serverId == null) {
                return
            }
            println "Stopping and deleting temporary Exaroton server ${serverId}..."
            def deadline = System.nanoTime() + Duration.ofMinutes(5).toNanos()
            Exception lastFailure
            while (System.nanoTime() < deadline) {
                try {
                    def server = request('GET', "servers/${serverId}/")
                    // Exaroton only permits deletion while offline (0) or crashed (7).
                    if (server.status in [0, 7]) {
                        request('DELETE', "servers/${serverId}/")
                        println "Deleted temporary Exaroton server ${serverId}."
                        serverId = null
                        return
                    }
                    if (server.status == 1) {
                        request('GET', "servers/${serverId}/stop/")
                    }
                    // Wait through starting, stopping, saving, and installation.
                } catch (Exception failure) {
                    lastFailure = failure
                    System.err.println("Cleanup will retry: ${failure.message}")
                }
                Thread.sleep(2500)
            }
            throw new IOException("Could not delete temporary server ${serverId}. Delete it manually in the Exaroton panel.", lastFailure)
        }
    }

    void run(String name, String minecraftVersion, String modsDir, List<File> jars, String testerUsername = '') {
        if (!token) {
            throw new IllegalArgumentException('Missing EXAROTON_TOKEN')
        }
        jars.each {
            if (!it.isFile()) {
                throw new IllegalArgumentException("Jar not found: ${it}")
            }
        }
        def shutdownHook = new Thread({
            try {
                cleanup()
            } catch (Exception failure) {
                System.err.println(failure.message)
            }
        }, 'exaroton-test-cleanup')
        Runtime.runtime.addShutdownHook(shutdownHook)
        try {
            def software = duringSession {
                // Fabric versions include the loader suffix, e.g. "26.3 (0.20.1)".
                request('GET', 'software?type=fabric').find {
                    it.version == minecraftVersion || it.version?.startsWith(minecraftVersion + ' (')
                }
            }
            if (software == null) {
                throw new IllegalStateException("Exaroton has no Fabric software for Minecraft ${minecraftVersion}.")
            }
            duringSession {
                def server = request('POST', 'servers/', [name: name, software: software.id])
                serverId = server.id
                println "Created temporary server ${server.address} (${serverId})."
            }
            // Creation can return before software installation has finished.
            def deadline = System.nanoTime() + Duration.ofMinutes(5).toNanos()
            while (duringSession { request('GET', "servers/${serverId}/").status } != 0) {
                if (System.nanoTime() >= deadline) {
                    throw new IOException('Timed out waiting for server installation')
                }
                Thread.sleep(2500)
            }
            def parts = modsDir.tokenize('/')
            def path = ''
            parts.each { part ->
                path += '/' + part
                def encoded = path.tokenize('/').collect { URLEncoder.encode(it, 'UTF-8').replace('+', '%20') }.join('/')
                duringSession { request('PUT', "servers/${serverId}/files/data/${encoded}/", null, 'inode/directory') }
            }
            jars.each { jar ->
                def encoded = (parts + jar.name).collect { URLEncoder.encode(it, 'UTF-8').replace('+', '%20') }.join('/')
                println "Uploading ${jar.name}..."
                duringSession { request('PUT', "servers/${serverId}/files/data/${encoded}/", jar, 'application/octet-stream') }
            }
            if (testerUsername) {
                duringSession {
                    request('PUT', "servers/${serverId}/playerlists/ops/", [entries: [testerUsername]])
                }
                println "Granted operator access to ${testerUsername}."
            }
            duringSession { request('GET', "servers/${serverId}/start/") }
            println 'Test session running. Cancel the Gradle task (Ctrl+C) to stop and delete this server.'
            def previousStatus = null
            def lastPollingFailure = null
            while (!stopping.get()) {
                try {
                    duringSession {
                        def server = request('GET', "servers/${serverId}/")
                        if (server.status != previousStatus) {
                            println "Server ${server.address}: status ${server.status}"
                            previousStatus = server.status
                        }
                        if (server.status == 1 && !server.players?.count) {
                            // A stop timer may not be active yet; rejection must not end the session.
                            request('POST', "servers/${serverId}/extend-time/", [time: 60])
                        }
                    }
                    lastPollingFailure = null
                } catch (IOException failure) {
                    // Once started, only cancellation should end the test session.
                    if (failure.message != lastPollingFailure) {
                        System.err.println("Session update failed; keeping the test server and retrying: ${failure.message}")
                        lastPollingFailure = failure.message
                    }
                }
                Thread.sleep(60_000)
            }
        } finally {
            cleanup()
            try {
                Runtime.runtime.removeShutdownHook(shutdownHook)
            } catch (IllegalStateException ignored) {
                // JVM shutdown is already running the same serialized cleanup.
            }
        }
    }

    static void main(String[] args) {
        new ExarotonTestServer(System.getenv('EXAROTON_TOKEN')).run(
                args[0], args[1], args[2], args.drop(3).collect { new File(it) },
                System.getenv('EXAROTON_TESTER_USERNAME')?.trim() ?: '')
    }
}
'''

// A child JVM receives termination on Gradle cancellation; a hook in the long-lived
// Gradle daemon would only run when the daemon itself exits.
tasks.register('runExarotonTestServer', JavaExec) {
    group = 'exaroton'
    description = 'Creates a temporary Fabric server, runs until cancelled, then stops and deletes it'
    dependsOn tasks.named('build')
    classpath = configurations.exarotonRunner
    mainClass = 'groovy.ui.GroovyMain'
    doFirst {
        def fabricApi = configurations.exarotonJars.files.findAll {
            it.name.matches('fabric-api-[0-9].*\\.jar')
        }
        if (fabricApi.isEmpty()) {
            throw new GradleException('Could not resolve the aggregated Fabric API jar.')
        }
        environment 'EXAROTON_TOKEN', obtainExarotonToken()
        environment 'EXAROTON_TESTER_USERNAME', exarotonProps()?.getProperty('testerUsername')?.trim() ?: ''
        def runnerFile = layout.buildDirectory.file('tmp/exaroton/ExarotonTestServer.groovy').get().asFile
        runnerFile.parentFile.mkdirs()
        runnerFile.setText(exarotonTestServerSource, 'UTF-8')
        setArgs([
                runnerFile.absolutePath,
                providers.gradleProperty('exarotonTestName').getOrElse(
                        exarotonProps()?.getProperty('testServerName') ?: 'wilpam-test'),
                project.minecraft_version.toString(),
                exarotonModsDir(),
                tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                *fabricApi.collect { it.absolutePath }
        ])
    }
}

tasks.register('deployToExaroton') {
    group = 'exaroton'
    description = 'Builds the mod and deploys it to the Exaroton test server'
    dependsOn tasks.named('build')

    doLast {
        def client = exarotonClient()
        def server = client.getServer(exarotonServerId())
        server.fetch().join()

        def software = server.getSoftware()
        logger.lifecycle("Server: {} ({})\n  status: {}\n  software: {} {}",
                server.getName(), server.getAddress(), server.getStatus(), software?.getName(), software?.getVersion())

        if (software != null && !software.getName().toLowerCase(Locale.ROOT).contains('fabric')) {
            logger.warn('Server is not running Fabric software ({}) - the mod will not load. Switch the software to Fabric in the Exaroton panel.', software.getName())
        }

        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Built jar not found: ${jarFile}")
        }

        // Upload the mod jar plus the fabric-api "fat" jar (single jar, Polymer/fabric-api are required by the mod).
        // Only the aggregated fabric-api jar is deployed - its module jars are already nested inside it.
        def filesToUpload = [jarFile]
        def fabricApiJars = configurations.exarotonJars.files.findAll { f -> f.getName().matches('fabric-api-[0-9].*\\.jar') }
        if (fabricApiJars.isEmpty()) {
            logger.warn('Could not resolve the fabric-api jar for deployment - the server may fail to start without it.')
        } else {
            filesToUpload.addAll(fabricApiJars)
        }

        // Mods are loaded from {exarotonModsDir}. Create it (and any parents) if missing.
        def dirsToEnsure = []
        def parts = []
        for (def part : exarotonModsDir().split('/').findAll { !it.isEmpty() }) {
            parts << part
            dirsToEnsure << ('/' + parts.join('/'))
        }
        for (def dir : dirsToEnsure) {
            def f = server.getFile(dir)
            def exists = false
            try {
                f.fetch().join()
                exists = f.isDirectory()
            } catch (ignored) {
                // does not exist yet
            }
            if (!exists) {
                try {
                    f.createAsDirectory().join()
                    logger.lifecycle('Created exaroton directory {}', dir)
                } catch (ignored) {
                    // already exists or the backend rejected it; an upload failure below will surface the real problem
                }
            }
        }

        def force = providers.gradleProperty('exaroton.force').getOrElse('false').toBoolean()
        def uploadedAny = false
        for (def file : filesToUpload) {
            def target = server.getFile(exarotonModsDir() + '/' + file.getName())

            def remoteSize = -1L
            if (!force) {
                try {
                    target.fetch().join()
                    remoteSize = target.getSize()
                } catch (ignored) {
                    // file not present on the server
                }
            }
            if (remoteSize == file.length()) {
                logger.lifecycle('Skipping {} (already up to date).', file.getName())
                continue
            }

            logger.lifecycle('Uploading {} to {}', file.getName(), target.getPath())
            target.upload(file.toPath()).join()
            logger.lifecycle('Uploaded {} successfully.', file.getName())
            uploadedAny = true
        }

        // Remove outdated standalone fabric-api module jars - they're now nested inside the
        // aggregated fabric-api jar and keeping both would cause duplicate mod ids.
        def staleJars = configurations.exarotonJars.files.findAll { f -> !f.getName().matches('fabric-api-[0-9].*\\.jar') }
        for (def stale : staleJars) {
            def staleFile = server.getFile(exarotonModsDir() + '/' + stale.getName())
            def exists = false
            try {
                staleFile.fetch().join()
                exists = true
            } catch (ignored) {
                // not present, nothing to clean
            }
            if (exists) {
                try {
                    staleFile.delete().join()
                    logger.lifecycle('Removed {} (superseded by the aggregated fabric-api jar).', stale.getName())
                    uploadedAny = true
                } catch (ignored) {
                    logger.warn('Could not remove {} - delete it manually from the mods folder.', stale.getName())
                }
            }
        }

        if (!uploadedAny && !force) {
            logger.lifecycle('Nothing changed - skipping server start/restart. Use -Pexaroton.force=true to force a restart.')
            return
        }

        def skipStart = providers.gradleProperty('exaroton.noStart').getOrElse('false').toBoolean()
        if (skipStart) {
            logger.lifecycle('Skipping server start/restart (exaroton.noStart=true).')
            return
        }

        // Polling helper (avoids websocket subscriptions that could keep the Gradle daemon alive).
        def awaitStatus = { Collection targets, int timeoutMillis ->
            def deadline = System.currentTimeMillis() + timeoutMillis
            while (System.currentTimeMillis() < deadline) {
                try {
                    server.fetch(true).join()
                } catch (ignored) {
                    // transient offline
                }
                if (targets.contains(server.getStatus())) {
                    return true
                }
                Thread.sleep(2500)
            }
            return false
        }

        def ONLINE = com.exaroton.api.server.ServerStatus.ONLINE
        def OFFLINE = com.exaroton.api.server.ServerStatus.OFFLINE
        def CRASHED = com.exaroton.api.server.ServerStatus.CRASHED

        // Wait for a server that is mid-transition (starting/stopping/saving/...) to settle.
        def settled = [ONLINE, OFFLINE, CRASHED]
        def status = server.getStatus()
        if (!settled.contains(status)) {
            logger.lifecycle('Server is transitioning ({}), waiting for it to settle...', status)
            if (!awaitStatus(settled, 180_000)) {
                logger.warn('Server did not settle within 3 minutes (status: {}). Skipping start/restart.', server.getStatus())
                return
            }
            status = server.getStatus()
        }

        if (status == ONLINE) {
            logger.lifecycle('Server is online, restarting to load the new mod...')
            server.restart().join()
        } else {
            logger.lifecycle('Server is {}, starting...', status)
            server.start().join()
        }

        logger.lifecycle('Waiting for the server to come online...')
        def ok = awaitStatus([ONLINE], 180_000)
        if (!ok) {
            def finalStatus = server.getStatus()
            if (finalStatus == CRASHED) {
                throw new GradleException('Server crashed while starting. Check the server logs for the error.')
            }
            logger.warn('Server did not reach ONLINE within 3 minutes (status: {}).', finalStatus)
        } else {
            logger.lifecycle('Server is ONLINE at {}', server.getAddress())
        }
    }
}

tasks.register('exarotonStatus') {
    group = 'exaroton'
    description = 'Shows the current Exaroton server status (read-only)'
    doLast {
        def client = exarotonClient()
        def server = client.getServer(exarotonServerId())
        server.fetch().join()
        def software = server.getSoftware()
        logger.lifecycle('Server: {} ({}) | status: {} | software: {} {}'.toString(),
                server.getName(), server.getAddress(), server.getStatus(), software?.getName(), software?.getVersion())
    }
}

tasks.register('exarotonLogs') {
    group = 'exaroton'
    description = 'Prints the tail of the Exaroton server log'
    doLast {
        def client = exarotonClient()
        def server = client.getServer(exarotonServerId())
        def content = server.getLog().join().getContent()
        def lines = (content == null ? '' : content).split('\r?\n')
        def tail = lines.length <= 400 ? lines : lines[-400..-1]
        tail.each { println it }
    }
}
